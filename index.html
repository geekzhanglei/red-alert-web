<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An original browser-based real-time strategy game prototype" />
    <title>Red Alert Web</title>
    <style>
      /* 首屏关键样式内联，避免模块脚本和 CSS 尚未到达时闪出默认白色控件。 */
      html, body { width: 100%; height: 100%; margin: 0; background: #101511; }
      body { overflow: hidden; }
      #app { width: 100%; height: 100%; visibility: hidden; background: #101511; }
      #app.app-ready { visibility: visible; }
      #boot-screen {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        color: #a8e0a8; background: radial-gradient(circle at 50% 40%, #18241d 0%, #08090a 100%);
        font: 600 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .12em;
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" role="status" aria-live="polite">正在加载战区…</div>
    <main id="app" aria-label="Red Alert Web 游戏">
      <div id="game-root"></div>
      <aside id="hud" aria-label="游戏状态">
        <span>资金 <span id="money">$0</span></span>
        <span id="selection-info">选择：无</span>
        <span id="tile-info">鼠标：—</span>
        <span id="view-actions">
          <button id="home-view" type="button" title="恢复开局的地图位置与缩放">重置视角 H</button>
          <button id="back-to-menu" type="button" title="结束当前试玩并返回难度选择">返回菜单</button>
        </span>
      </aside>
      <aside id="build-bar" aria-label="建造栏">
        <button type="button" data-building="refinery">矿场 $2000</button>
        <button type="button" data-building="barracks">兵营 $500</button>
        <button type="button" data-building="factory">战车工厂 $2000</button>
        <p id="build-hint">点击按钮开始放置 · 左键确认 · 右键 / Esc 取消</p>
      </aside>
      <aside id="prod-panel" aria-label="生产面板"></aside>
      <p id="controls-hint">左键选中 · 右键移动/攻击 · 中键拖拽平移 · 滚轮缩放 · H 回主视图 · 空格暂停 · Shift+1/2/3 调速 · Ctrl+1~9 编队 · 1~9 复读</p>
      <div id="squad-flash" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
