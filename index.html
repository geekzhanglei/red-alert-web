<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An original browser-based real-time strategy game prototype" />
    <title>Red Alert Web</title>
    <style>
      /* 首屏关键样式内联，避免模块脚本和 CSS 尚未到达时闪出默认白色控件。 */
      html, body { width: 100%; height: 100%; margin: 0; background: #101511; }
      body { overflow: hidden; }
      #app { width: 100%; height: 100%; visibility: hidden; background: #101511; }
      #app.app-ready { visibility: visible; }
      #boot-screen {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        color: #a8e0a8; background: radial-gradient(circle at 50% 40%, #18241d 0%, #08090a 100%);
        font: 600 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .12em;
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" role="status" aria-live="polite">正在加载战区…</div>
    <main id="app" aria-label="Red Alert Web 游戏">
      <div id="game-root"></div>
      <aside id="left-sidebar" aria-label="战区控制面板">
        <section id="hud" aria-label="游戏状态">
          <small>资金 / CREDITS</small><strong id="money">$0</strong>
        </section>
        <section id="radar-panel" aria-label="战区小地图">
          <div class="radar-screen"><canvas id="minimap-canvas" aria-label="可点击跳转的战区小地图"></canvas><i class="radar-sweep" aria-hidden="true"></i></div>
        </section>
        <nav id="view-actions" aria-label="战术操作">
          <button id="home-view" type="button" title="恢复开局的地图位置与缩放"><kbd>H</kbd> 主视图</button>
          <button id="open-options" type="button" title="打开游戏选项"><kbd>Esc</kbd> 选项</button>
          <button id="back-to-menu" type="button" title="结束当前试玩并返回难度选择">退出战局</button>
        </nav>
        <nav id="catalog-tabs" aria-label="生产分类">
          <button type="button" class="is-active" data-catalog-tab="structures" title="建筑"><span aria-hidden="true">▰</span><small>建筑</small></button>
          <button type="button" data-catalog-tab="defense" title="防御"><span aria-hidden="true">◆</span><small>防御</small></button>
          <button type="button" data-catalog-tab="infantry" title="步兵"><span aria-hidden="true">♟</span><small>步兵</small></button>
          <button type="button" data-catalog-tab="vehicles" title="载具"><span aria-hidden="true">▣</span><small>载具</small></button>
        </nav>
        <aside id="build-bar" aria-label="建造栏">
          <div id="power-gauge" role="meter" aria-label="基地电力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="power-track" aria-hidden="true"><i class="power-produced"></i><i class="power-consumed"></i><i class="power-supply"></i><i class="power-demand"></i></span>
            <strong id="power-status">0 / 0</strong>
          </div>
          <header><span id="catalog-title">基地建造</span><small id="catalog-code">STRUCTURES</small></header>
          <button type="button" data-catalog="structures" data-building="refinery"><span class="build-icon build-icon-refinery" aria-hidden="true"></span><span><strong>矿石精炼厂</strong><small>经济设施</small></span><b>$2000</b></button>
          <button type="button" data-catalog="structures" data-building="barracks"><span class="build-icon build-icon-barracks" aria-hidden="true"></span><span><strong>步兵营</strong><small>步兵生产</small></span><b>$500</b></button>
          <button type="button" data-catalog="structures" data-building="factory"><span class="build-icon build-icon-factory" aria-hidden="true"></span><span><strong>战车工厂</strong><small>载具生产</small></span><b>$2000</b></button>
          <button type="button" data-catalog="structures" data-building="powerPlant"><span class="build-icon build-icon-power" aria-hidden="true"></span><span><strong>发电厂</strong><small>电力 +100</small></span><b>$800</b></button>
          <button type="button" data-catalog="defense" data-building="guardTower"><span class="build-icon build-icon-tower" aria-hidden="true"></span><span><strong>警戒塔</strong><small>自动防御</small></span><b>$700</b></button>
          <button type="button" data-catalog="structures" data-building="radar"><span class="build-icon build-icon-radar" aria-hidden="true"></span><span><strong>雷达站</strong><small>扩大视野</small></span><b>$1200</b></button>
          <div id="unit-catalog" aria-live="polite"></div>
          <p id="catalog-empty">该分类尚未解锁任何项目</p>
          <p id="build-hint">点击按钮开始放置 · 左键确认 · 右键 / Esc 取消</p>
        </aside>
        <p id="controls-hint">左键选中 · 右键移动/攻击 · 中键拖拽平移 · 滚轮缩放 · H 回主视图 · 空格暂停 · Shift+1/2/3 调速 · Ctrl+1~9 编队 · 1~9 复读</p>
      </aside>
      <section id="options-dialog" class="options-dialog" hidden aria-label="游戏选项">
        <div class="options-window" role="dialog" aria-modal="true" aria-labelledby="options-title">
          <header class="options-header">
            <div>
              <small>COMMAND OPTIONS</small>
              <h2 id="options-title">游戏选项</h2>
            </div>
            <button id="close-options" class="options-close" type="button" aria-label="关闭选项">×</button>
          </header>
          <div class="options-body">
            <label class="options-range" for="mouse-sensitivity">
              <span><b>鼠标灵敏度</b><output id="mouse-sensitivity-value" for="mouse-sensitivity">100%</output></span>
              <input id="mouse-sensitivity" type="range" min="50" max="200" value="100" step="10" />
            </label>
            <p class="options-help">调整中键拖拽、边缘滚屏和滚轮缩放的速度。设置会自动保存到本机。</p>
            <div class="options-save-grid" aria-label="战场存档">
              <button id="save-battlefield" type="button">保存战场</button>
              <button id="load-battlefield" type="button">读取存档</button>
            </div>
            <p id="options-save-status" class="options-save-status" role="status" aria-live="polite"></p>
          </div>
          <footer class="options-footer">
            <button id="resume-game" type="button">返回战场</button>
          </footer>
        </div>
      </section>
      <div id="squad-flash" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
