server {
    listen 80;
    server_name game.feroad.com;
    return 301 https://game.feroad.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name game.feroad.com;

    root /www/frontEnd/red-alert-web/current;
    index index.html;

    include /etc/nginx/default.d/ssl_certificate.conf;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/default.d/error_page.conf;
}
